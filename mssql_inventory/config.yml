
services:
  default_config: &default
    # Use ODBC Driver 18 (the image installs msodbcsql18). If you prefer Driver 17,
    # install msodbcsql17 in the image instead.
  # Allow self-signed certificates in lab/dev environments by trusting the server
  # certificate (TrustServerCertificate=yes). For production, remove this and use
  # a proper CA-signed cert.
    DATABASE_URL: "mssql+pyodbc://sql_helper:Abcd1234@db01.kaskade.local:1433/inventory?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
    TIMEOUT_SECONDS: 30
    MAX_RETRIES: 3
    COMPLEX: NONE
    # Default value is NONE for MSSQL (can be overridden)

  supplier_creator:
    <<: *default
    PREGENERATE_COUNT: 0
    WAIT_TIME_MS: [300000, 900000]
    TYPE: ["manufacturer", "wholesaler", "distributor", "retailer"]
    NUM_PROCESSES: 1

  orders_creator:
    <<: *default
    NUM_PROCESSES: 4
    WAIT_TIME_MS: [1000, 15000]
    TYPE: [{"name":"vehicle", "provider":"VehicleProvider", "method":"fake.vehicle_object()"}, {"name":"music", "provider":"MusicProvider", "method":"fake.music_genre_object()"}]
    STATUS:
      created: 50
      pending: 8
      shipped: 20
      delivered: 10
      others: 12
    RETENTION_HOURS: 240

  orders_modifier:
    <<: *default
    NUM_PROCESSES: 4
    WAIT_TIME_MS: [3000, 15000]
    STATUS:
      cancelled: 8
      shipped: 12
      delivered: 40
      completed: 40
    RAND_LAST_HOURS: 12

  orders_purger:
    <<: *default
    NUM_PROCESSES: 1
    WAIT_TIME_MS: [6000, 12000]
    RETENTION_HOURS: 3
    BATCH_SIZE: 500
